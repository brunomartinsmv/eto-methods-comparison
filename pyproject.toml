[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eto-methods-comparison"
version = "1.0.2"
description = "Reproducible comparison of reference evapotranspiration methods against FAO-56 Penman-Monteith."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Bruno Martins M. Vieira" },
]
keywords = [
  "evapotranspiration",
  "reference evapotranspiration",
  "Penman-Monteith",
  "FAO-56",
  "reproducible research",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Atmospheric Science",
]
dependencies = [
  "pandas>=2.2,<3.1",
  "numpy>=1.26,<3",
  "matplotlib>=3.8,<4",
  "scikit-learn>=1.5,<2",
  "openpyxl>=3.1,<4",
  "PyYAML>=6,<7",
]

[project.scripts]
eto-pipeline = "scripts.cli:main"

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "ruff>=0.8,<0.14",
  "nbformat>=5.10,<6",
  "nbclient>=0.10,<0.11",
  "ipykernel>=6,<8",
]
era5 = [
  "cdsapi>=0.7.7",
]

[project.urls]
Repository = "https://github.com/brunomartinsmv/eto-methods-comparison"
Issues = "https://github.com/brunomartinsmv/eto-methods-comparison/issues"

[tool.setuptools]
packages = ["scripts"]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = [
  "notebooks",
  "scripts/legacy",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
