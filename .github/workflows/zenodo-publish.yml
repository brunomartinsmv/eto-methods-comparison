name: Publish Zenodo release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Git tag to publish on Zenodo
        required: true
        default: v2.0.0

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Publish release archive to Zenodo
        env:
          ZENODO_ACCESS_TOKEN: ${{ secrets.ZENODO_ACCESS_TOKEN }}
        run: |
          TAG="${{ github.event.release.tag_name || inputs.tag }}"
          python -m scripts.publish_zenodo_release \
            --tag "$TAG" \
            --deposition-id 18615164
