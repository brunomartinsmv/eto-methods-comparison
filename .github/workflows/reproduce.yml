name: Reproduce

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  validate:
    name: Lint, test, and reproduce (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    env:
      MPLCONFIGDIR: /tmp/matplotlib-cache

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install project and development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint active Python source
        run: python -m ruff check .

      - name: Run tests (including golden-file table hashes)
        run: python -m pytest

      - name: Run paper reproduction when raw data is available
        run: |
          if [ -f data/raw/Evapo.xlsx ]; then
            python -m scripts.cli reproduce-paper --year 2024
          else
            echo "Skipping paper reproduction: data/raw/Evapo.xlsx is not available in this checkout."
          fi
